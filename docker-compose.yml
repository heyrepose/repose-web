# =============================================================================
# repose-web — self-contained dev compose
# =============================================================================
# Requires a running API somewhere on port 4000.
# If the API runs locally (not in Docker): API_BASE_URL defaults to
# host.docker.internal which resolves to your host machine on Docker Desktop.
#
# Run from repose-web/:
#   docker compose up
#
# Override API location:
#   API_BASE_URL=http://api.dev.example.com/api/v1 docker compose up
# =============================================================================

name: repose-web

networks:
  web_net:
    driver: bridge

volumes:
  web_nm:
  web_next:

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: repose_web
    restart: unless-stopped
    environment:
      NODE_ENV:              development
      API_BASE_URL:          ${API_BASE_URL:-http://host.docker.internal:4000/api/v1}
      SOCKET_URL:            ${SOCKET_URL:-http://host.docker.internal:4000}
      SITE_URL:              ${SITE_URL:-http://localhost:4001}
      GOOGLE_CLIENT_ID:      ${GOOGLE_CLIENT_ID:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "4001:4001"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./packages:/app/packages
      - ./next.config.mjs:/app/next.config.mjs:ro
      - ./tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - web_nm:/app/node_modules
      - web_next:/app/.next
    networks:
      - web_net
    # Lets Docker Desktop containers reach host machine services
    extra_hosts:
      - "host.docker.internal:host-gateway"
